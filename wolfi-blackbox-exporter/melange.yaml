package:
  name: blackbox-exporter-custom
  version: 0.28.0
  epoch: 5
  description: "Prometheus Blackbox Exporter - 0 CVE Hardcore Build"
  target-architecture:
    - all  # <--- Tak jak chciałeś. Generyczny config.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - wolfi-base
      - go
      - make
      - git
      - build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/blackbox_exporter
      tag: v0.28.0
      depth: 1

  - name: Build Binary
    runs: |
      export CGO_ENABLED=0
      COMMIT_SHA=$(git rev-parse --short HEAD)
      BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
      
      echo "Building Blackbox Exporter..."
      
      go build -ldflags \
        "-s -w \
         -X github.com/prometheus/common/version.Version=0.28.0 \
         -X github.com/prometheus/common/version.Revision=${COMMIT_SHA} \
         -X github.com/prometheus/common/version.Branch=HEAD \
         -X github.com/prometheus/common/version.BuildDate=${BUILD_DATE}" \
        -o blackbox_exporter .

  - name: Install
    runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      mv blackbox_exporter ${{targets.destdir}}/usr/bin/
      chmod 755 ${{targets.destdir}}/usr/bin/blackbox_exporter