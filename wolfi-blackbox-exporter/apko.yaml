contents:
  repositories:
    - https://packages.wolfi.dev/os
    - ./packages/
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./local-melange.rsa.pub
  packages:
    - wolfi-base
    - ca-certificates-bundle
    - blackbox-exporter-custom

accounts:
  groups:
    - groupname: blackbox
      gid: 1002
  users:
    - username: blackbox
      uid: 1002
      gid: 1002
  run-as: 1002

paths:
  - path: /etc/blackbox_exporter
    type: directory
    permissions: 0775
    uid: 1002
    gid: 1002
    recursive: true

entrypoint:
  command: /usr/bin/blackbox_exporter

archs:
  - amd64