contents:
  repositories:
    - https://packages.wolfi.dev/os
    - ./packages
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./local-melange.rsa.pub
  packages:
    - wolfi-base
    - ca-certificates-bundle
    - pgpool2-exporter-custom

accounts:
  groups:
    - groupname: pgpool
      gid: 10001
  users:
    - username: pgpool
      uid: 10001
      gid: 10001
  run-as: 10001

entrypoint:
  command: /usr/bin/pgpool2_exporter

archs:
  - amd64