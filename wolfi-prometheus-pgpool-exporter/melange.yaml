package:
  name: pgpool2-exporter-custom
  version: 1.2.2
  epoch: 2
  description: "Pgpool2 Exporter custom build without CVEs (Patched Protobuf)"
  target-architecture:
    - all
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - wolfi-base
      - ca-certificates-bundle
      - go
      - make
      - git
      - build-base
      - file

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pgpool/pgpool2_exporter
      tag: v1.2.2
      depth: 1

  - name: Build Pgpool2 Exporter
    runs: |
      # 1. Setup AMD64
      export CGO_ENABLED=0
      export GOOS=linux
      export GOARCH=amd64
      
      # 2. Download dependencies
      go mod download
      
      # --- FIX CVE-2024-24786 ---
      echo "--- PATCHING VULNERABLE LIB (Protobuf) ---"
      go get google.golang.org/protobuf@v1.33.0
      go mod tidy
      echo "--- PATCH APPLIED ---"
      # --------------------------

      mkdir -p bin

      # 3. Locate main.go
      echo "--- LOCATING MAIN PACKAGE ---"
      MAIN_FILE=$(find . -name "main.go" | head -n 1)
      
      if [ -z "$MAIN_FILE" ]; then
         # Fallback
         echo "main.go not found, searching for pgpool2_exporter.go..."
         MAIN_FILE=$(grep -l "package main" *.go | head -n 1)
      fi

      if [ -z "$MAIN_FILE" ]; then
         echo "CRITICAL ERROR: Could not find entry point (package main)!"
         exit 1
      fi

      echo "Found entry point at: $MAIN_FILE"
      
      echo "--- BUILDING BINARY ---"
      # Budujemy (flagi -s -w dla odchudzenia)
      go build -v -ldflags="-s -w" -o bin/pgpool2_exporter $MAIN_FILE

      # 4. Verify arch
      echo "--- VERIFICATION ---"
      ls -lh bin/pgpool2_exporter
      file bin/pgpool2_exporter
      
      if file bin/pgpool2_exporter | grep -q "ELF 64-bit LSB executable, x86-64"; then
         echo "SUCCESS: Built valid ELF binary for AMD64."
      else
         echo "FAILURE: Output is NOT a valid AMD64 binary."
         exit 1
      fi

  - name: Install
    runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      install -m 0755 bin/pgpool2_exporter ${{targets.destdir}}/usr/bin/pgpool2_exporter