contents:
  repositories:
    - https://packages.wolfi.dev/os
    - ./packages/
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ./local-melange.rsa.pub
    # Baza:
    - wolfi-base
    # Bardzo ważne dla SSL/Vault/Postgres connection:
    - ca-certificates-bundle 
    # Nasza paczka:
    - postgres-exporter-custom

accounts:
  groups:
    - groupname: postgres-exporter
      gid: 1001
  users:
    - username: postgres-exporter
      uid: 1001
      gid: 1001
  run-as: 1001

# OpenShift friendly paths (jeśli kiedyś będziesz chciał montować configi)
paths:
  - path: /etc/postgres_exporter
    type: directory
    permissions: 0775 # Group writeable dla OKD
    uid: 1001
    gid: 1001
    recursive: true

entrypoint:
  command: /usr/bin/postgres_exporter

archs:
  - amd64
